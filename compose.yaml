services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: roseiot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roseiot}
      POSTGRES_DB: roseiot
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roseiot -d roseiot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"
