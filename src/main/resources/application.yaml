spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: roseiot
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start-and-stop
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
app:
  auth:
    jwt:
      hmac-secret: ${ROSEIOT_JWT_HMAC_SECRET}
      access-token-ttl: ${ROSEIOT_ACCESS_TOKEN_TTL:10m}
      refresh-token-ttl: ${ROSEIOT_REFRESH_TOKEN_TTL:30d}
      reset-token-ttl: ${ROSEIOT_PASSWORD_RESET_TOKEN_TTL:30m}
    mail:
      base-url: ${APP_BASE_URL:http://localhost:8080}
      from: ${MAIL_FROM:no-reply@localhost}
    password-policy:
      minimum-length: ${ROSEIOT_PASSWORD_MINIMUM_LENGTH:12}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
