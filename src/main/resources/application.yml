spring:
  application:
    name: roseiot
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${ROSEIOT_MAIL_HOST:localhost}
    port: ${ROSEIOT_MAIL_PORT:1025}
    username: ${ROSEIOT_MAIL_USERNAME:}
    password: ${ROSEIOT_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.auth]": ${ROSEIOT_MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${ROSEIOT_MAIL_SMTP_STARTTLS:false}
  docker:
    compose:
      skip:
        in-tests: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roseiot}
    username: ${SPRING_DATASOURCE_USERNAME:roseiot}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

roseiot:
  http:
    max-request-body-bytes: 1048576
    max-authentication-request-body-bytes: 16384
  rate-limit:
    enabled: ${ROSEIOT_RATE_LIMIT_ENABLED:true}
    window-minutes: 15
    max-request-body-bytes: 16384
    max-tracked-keys: 10000
    rules:
      - method: POST
        path: /api/login
        body-field: email
        key-prefix: "auth:login:"
        max-attempts: 10
      - method: POST
        path: /api/password-resets
        body-field: email
        key-prefix: "auth:reset-email:"
        max-attempts: 5
      - method: POST
        path: /api/password-resets/validations
        key-prefix: "auth:reset-token-check:"
        max-attempts: 20
      - method: POST
        path: /api/password-resets/confirmations
        key-prefix: "auth:reset-token-use:"
        max-attempts: 20
  password-reset:
    email:
      enabled: ${ROSEIOT_PASSWORD_RESET_EMAIL_ENABLED:false}
      from: ${ROSEIOT_PASSWORD_RESET_EMAIL_FROM:}
  auth:
    jwt:
      secret: ${ROSEIOT_AUTH_JWT_SECRET}
      issuer: ${ROSEIOT_AUTH_JWT_ISSUER:https://roseiot.local}
      audience: ${ROSEIOT_AUTH_JWT_AUDIENCE:roseiot-api}

mybatis-plus:
  type-handlers-package: io.roseiot.shared.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
