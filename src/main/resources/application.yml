spring:
  application:
    name: roseiot
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      skip:
        in-tests: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roseiot}
    username: ${SPRING_DATASOURCE_USERNAME:roseiot}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

roseiot:
  rate-limit:
    enabled: ${ROSEIOT_RATE_LIMIT_ENABLED:true}
    window-minutes: 15
    rules:
      - method: POST
        path: /login
        body-field: email
        key-prefix: "auth:login:"
        max-attempts: 10
      - method: POST
        path: /password-resets
        body-field: email
        key-prefix: "noauth:reset-password:"
        max-attempts: 5
  auth:
    jwt:
      secret: ${ROSEIOT_AUTH_JWT_SECRET}

mybatis-plus:
  type-handlers-package: io.roseiot.shared.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
