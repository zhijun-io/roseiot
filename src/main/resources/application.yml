spring:
  application:
    name: roseiot
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  docker:
    compose:
      skip:
        in-tests: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roseiot}
    username: ${SPRING_DATASOURCE_USERNAME:roseiot}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, db

server:
  port: ${SERVER_PORT:8080}

roseiot:
  bootstrap:
    enabled: false
  auth:
    jwt:
      hmac-secret: ${ROSEIOT_AUTH_JWT_SECRET:dev-only-change-me-32chars-minimum!!}
    rate-limit:
      enabled: ${ROSEIOT_AUTH_RATE_LIMIT_ENABLED:true}
      window-minutes: 15
      login-max-attempts: 10
      recovery-max-attempts: 5

mybatis-plus:
  type-handlers-package: io.roseiot.platform.persistence
  configuration:
    map-underscore-to-camel-case: true
